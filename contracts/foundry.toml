[profile.default]
src = "sol"
out = "out"
libs = ["../node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"

remappings = [
  "@gluwa/asc-contracts/=../node_modules/@gluwa/asc-contracts/",
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/"
]

[rpc_endpoints]
creditcoin = "https://rpc.cc3-testnet.creditcoin.network"
sepolia = "https://rpc.sepolia.org"
