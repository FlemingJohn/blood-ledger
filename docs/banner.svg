<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Blood Ledger">
  <defs>
    <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d6154e" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#8b0b2e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b0b2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centreLight" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#2c0d16" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0307" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moltenLetters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a030"/>
      <stop offset="22%" stop-color="#c9a227"/>
      <stop offset="62%" stop-color="#d6154e"/>
      <stop offset="100%" stop-color="#8b0b2e"/>
    </linearGradient>
    <linearGradient id="ruleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c0d16" stop-opacity="0"/>
      <stop offset="18%" stop-color="#8b0b2e" stop-opacity="0.9"/>
      <stop offset="82%" stop-color="#8b0b2e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2c0d16" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="#0a0307"/>
  <rect width="1200" height="340" fill="url(#centreLight)"/>
  <circle cx="132" cy="150" r="150" fill="url(#torchGlow)"/>
  <circle cx="1068" cy="150" r="150" fill="url(#torchGlow)"/>

  <g fill="#d6154e">
    <path d="M126 96 q10 -30 6 -46 q14 20 12 46 q10 -12 8 -26 q12 22 4 42 q-16 10 -32 0 q-8 -18 2 -34 q0 10 0 18Z"/>
    <path d="M1062 96 q10 -30 6 -46 q14 20 12 46 q10 -12 8 -26 q12 22 4 42 q-16 10 -32 0 q-8 -18 2 -34 q0 10 0 18Z"/>
  </g>
  <g fill="#2c0d16" stroke="#4a1622" stroke-width="2">
    <path d="M108 104 h48 l-8 26 h-32Z"/>
    <path d="M1044 104 h48 l-8 26 h-32Z"/>
    <rect x="126" y="130" width="12" height="78"/>
    <rect x="1062" y="130" width="12" height="78"/>
    <path d="M112 208 h40 l10 18 h-60Z"/>
    <path d="M1048 208 h40 l10 18 h-60Z"/>
  </g>

  <text x="600" y="150" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="bold" letter-spacing="14" fill="url(#moltenLetters)">BLOOD LEDGER</text>

  <rect x="200" y="182" width="800" height="2" fill="url(#ruleFade)"/>

  <text x="600" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#e0d5c4">Someone gives you money to go into a dungeon.</text>
  <text x="600" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#e0d5c4">If you succeed, you both profit. If you die, <tspan fill="#8b0b2e" font-style="italic">their money is gone</tspan>.</text>

  <g font-family="'Courier New', monospace" font-size="13" letter-spacing="2">
    <text x="286" y="304" fill="#7d6a70">0x91C2</text>
    <text x="366" y="304" fill="#d6154e">DIED   FLOOR 2</text>
    <text x="560" y="304" fill="#7d6a70">-500</text>
    <text x="676" y="304" fill="#7d6a70">0x44AB</text>
    <text x="756" y="304" fill="#c9a227">WALKED OUT</text>
    <text x="900" y="304" fill="#c9a227">+420</text>
  </g>
  <rect x="200" y="284" width="800" height="1" fill="#2c0d16"/>
</svg>
