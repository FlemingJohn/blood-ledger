<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="How one raid runs from patron to ledger">
  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6e6152"/>
    </marker>
  </defs>

  <rect width="1200" height="460" fill="#0f0c0b"/>

  <text x="600" y="44" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="6" fill="#ddd3be">ONE RAID, END TO END</text>
  <rect x="420" y="60" width="360" height="1" fill="#2a1a16"/>

  <g font-family="'Courier New', monospace" font-size="12" letter-spacing="2">
    <text x="150" y="104" text-anchor="middle" fill="#6e6152">ETHEREUM SEPOLIA</text>
    <text x="600" y="104" text-anchor="middle" fill="#6e6152">CREDITCOIN CC3</text>
    <text x="1050" y="104" text-anchor="middle" fill="#6e6152">THE DUNGEON</text>
  </g>

  <g fill="#1a1210" stroke="#2a1a16" stroke-width="1">
    <rect x="40" y="126" width="220" height="104"/>
    <rect x="490" y="126" width="220" height="104"/>
    <rect x="940" y="126" width="220" height="104"/>
    <rect x="490" y="300" width="220" height="104"/>
    <rect x="940" y="300" width="220" height="104"/>
    <rect x="40" y="300" width="220" height="104"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#ddd3be">
    <text x="150" y="164" text-anchor="middle">A patron stakes</text>
    <text x="150" y="188" text-anchor="middle" fill="#c9a227">500 coins</text>
    <text x="600" y="164" text-anchor="middle">Attestcoin proves</text>
    <text x="600" y="188" text-anchor="middle" fill="#c4402a">the coin is real</text>
    <text x="1050" y="164" text-anchor="middle">You get a blade</text>
    <text x="1050" y="188" text-anchor="middle" fill="#c4402a">and a debt</text>

    <text x="1050" y="338" text-anchor="middle">You descend</text>
    <text x="1050" y="362" text-anchor="middle" fill="#6e6152">kill, loot, choose</text>
    <text x="600" y="338" text-anchor="middle">Walk out or fall</text>
    <text x="600" y="362" text-anchor="middle" fill="#6e6152">one transaction</text>
    <text x="150" y="338" text-anchor="middle">The ledger records</text>
    <text x="150" y="362" text-anchor="middle" fill="#c9a227">what you are worth</text>
  </g>

  <g stroke="#6e6152" stroke-width="1.5" fill="none" marker-end="url(#arrowHead)">
    <path d="M262 178 H486"/>
    <path d="M712 178 H936"/>
    <path d="M1050 232 V296"/>
    <path d="M938 352 H714"/>
    <path d="M488 352 H264"/>
  </g>

  <g font-family="'Courier New', monospace" font-size="11" letter-spacing="1" fill="#6e6152">
    <text x="374" y="168" text-anchor="middle">event</text>
    <text x="824" y="168" text-anchor="middle">verified at 0x0FD2</text>
    <text x="826" y="342" text-anchor="middle">settle</text>
    <text x="376" y="342" text-anchor="middle">standing moves</text>
  </g>

  <rect x="40" y="424" width="1120" height="1" fill="#2a1a16"/>
  <text x="40" y="450" font-family="'Courier New', monospace" font-size="12" letter-spacing="2" fill="#6e6152">NO TRANSACTION RUNS WHILE YOU ARE SWINGING. THE CHAIN WAITS AT BOTH DOORS.</text>
</svg>
