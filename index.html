<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blood Ledger</title>
    <meta
      name="description"
      content="Someone gives you money to go into a dungeon. If you succeed, you both profit. If you die, their money is gone."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nosifer&family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #030101;
        color: #ece0d6;
      }

      .boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #030101;
        transition: opacity 700ms ease;
      }

      .boot::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse 46% 34% at 50% 48%, rgba(96, 1, 16, 0.5), transparent 72%);
        animation: bootBreathes 5.2s ease-in-out infinite;
      }

      .boot--lifting {
        opacity: 0;
        pointer-events: none;
      }

      .boot__word {
        position: relative;
        margin: 0;
        font-family: Cinzel, 'Trajan Pro', Georgia, serif;
        font-size: clamp(1.5rem, 4.4vw, 2.5rem);
        font-weight: 500;
        letter-spacing: 0.5em;
        text-indent: 0.5em;
        text-transform: uppercase;
        color: #6e1626;
      }

      .boot__rail {
        position: relative;
        width: min(300px, 52vw);
        height: 1px;
        background: rgba(96, 1, 16, 0.32);
        overflow: hidden;
      }

      .boot__filled {
        display: block;
        width: 30%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #c4123f, transparent);
        animation: bootRuns 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      .boot__said {
        position: relative;
        margin: 0;
        font-family: 'JetBrains Mono', Consolas, monospace;
        font-size: 0.55rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #4a3138;
      }

      @keyframes bootBreathes {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }

      @keyframes bootRuns {
        from { transform: translateX(-110%); }
        to { transform: translateX(440%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot::before,
        .boot__filled {
          animation: none;
        }
        .boot__filled {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <div class="boot" id="boot" role="status" aria-live="polite">
      <p class="boot__word">Blood Ledger</p>
      <div class="boot__rail"><span class="boot__filled"></span></div>
      <p class="boot__said">Lighting the torches</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
